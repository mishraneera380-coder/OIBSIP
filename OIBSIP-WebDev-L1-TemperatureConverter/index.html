<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div class="card-head">
            <h1>Temperature Converter</h1>
            <p>Convert instantly between Celsius, Fahrenheit &amp; Kelvin</p>
        </div>

        <div class="input-row">
            <label for="field-label" for="tempInput">Enter Temperature</label>
            <input type="text" id="tempInput" placeholder="e.g. 27" inputmode="decimal" autocomplete="off">
            <div class="error-msg" id="errorMsg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="errorText">Please enter a valid number.</span>
            </div>
        </div>

        <div class="unit-row">
            <label class="field-label">Input Unit</label>
        </div>
    </div>
</body>
</html>
